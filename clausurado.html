<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Clausurados</title>

  <link rel="icon"
        type="image/png"
        href="https://i.postimg.cc/0yX4db3M/logo-movil.png">

  <meta name="theme-color" content="#000000">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- 🔎 BUSCADOR -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css"
        rel="stylesheet">

  <style>

    body {
      background: linear-gradient(180deg,#000,#1a1a1a);
      color: white;
      margin: 0;
      font-family: Arial;
    }

    .container-app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #111;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    #titulo {
      background: #d32f2f;
      color: #fff;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
    }

    label {
      margin-top: 12px;
      color: #ccc;
      font-size: 14px;
    }

    .form-control,
    .form-select {
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
    }

    .form-select.has-value {
      background-color: #d32f2f !important;
      color: #fff !important;
      font-weight: bold;
      border-color: #d32f2f !important;
    }

    .btn-main {
      background: #d32f2f;
      color: white;
      width: 100%;
      margin-top: 18px;
      border: none;
      padding: 14px;
      border-radius: 10px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-menu {
      background: #333;
      color: #ccc;
      flex: 1;
      border-radius: 10px;
      padding: 12px;
    }

    .btn-clear {
      background: #2e7d32;
      color: white;
      flex: 1;
      border-radius: 10px;
      padding: 12px;
      border: none;
    }

    /* LOADER */

    #loader {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .logo-loader {
      position: relative;
      width: 140px;
      height: 140px;
    }

    .logo-base {
      width: 100%;
      filter: grayscale(100%) brightness(0.5);
    }

    .logo-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      clip-path: inset(100% 0 0 0);
      animation: llenar 2s cubic-bezier(0.65,0,0.35,1) infinite;
    }

    @keyframes llenar {

      0% {
        clip-path: inset(100% 0 0 0);
      }

      50% {
        clip-path: inset(0% 0 0 0);
      }

      100% {
        clip-path: inset(100% 0 0 0);
      }
    }

    /* 🔎 ESTILOS BUSCADOR */

    .ts-control{
      background:#222 !important;
      border:1px solid #444 !important;
      color:white !important;
    }

    .ts-control input{
      color:white !important;
    }

    .ts-dropdown{
      background:#222 !important;
      border:1px solid #444 !important;
    }

    .ts-dropdown .option{
      color:white;
    }

    .ts-dropdown .active{
      background:#d32f2f !important;
      color:white !important;
    }

  </style>
</head>

<body>

<!-- LOADER -->

<div id="loader">
  <div class="logo-loader">

    <img class="logo-base"
         src="https://i.postimg.cc/66GFrCnz/logo-claro-removebg-preview.png">

    <img class="logo-fill"
         src="https://i.postimg.cc/66GFrCnz/logo-claro-removebg-preview.png">

  </div>
</div>

<div class="container-app">

  <div id="titulo">Clausurados</div>

  <label>Supervisor</label>

  <input id="supervisorInput"
         class="form-control mb-2"
         readonly>

  <label for="caminanteSelect">Caminante</label>

  <select id="caminanteSelect"
          class="form-select mb-2" disabled>

    <option value="">Seleccione caminante</option>

  </select>

  <label for="zonaSelect">Zona</label>

  <select id="zonaSelect"
          class="form-select mb-2" disabled>

    <option value="">Todas las zonas</option>

  </select>

  <label for="psrSelect">Código PSR - Nombre PSR</label>

  <select id="psrSelect"
          class="form-select mb-2" disabled>

    <option value="">Seleccione PSR</option>

  </select>
<p id="estadoPSR" class="small mt-2" role="status" aria-live="polite">Cargando caminantes y PSR...</p>

  <label>Observaciones</label>

  <textarea id="observaciones"
            class="form-control mb-2"
            rows="3"></textarea>

  <label>Fotos</label>

  <input type="file"
         id="fotos"
         class="form-control mb-2"
         multiple
         accept="image/*">

  <button class="btn btn-main"
          onclick="enviarAuditoria()">

    Enviar Auditoría

  </button>

  <div class="btn-row">

    <button class="btn btn-menu"
            onclick="volverMenu()">

      Menú

    </button>

    <button class="btn btn-clear"
            onclick="limpiarFormulario()">

      Borrar formulario

    </button>

  </div>

</div>

<!-- MODAL OK -->

<div class="modal fade"
     id="modalOk"
     tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content bg-dark text-white text-center">

      <div class="modal-header border-0">

        <h5>✔ Auditoría enviada</h5>

      </div>

      <div class="modal-body">

        Registro guardado correctamente

      </div>

      <div class="modal-footer border-0">

        <button type="button"
                class="btn btn-success w-100"
                data-bs-dismiss="modal">

          OK

        </button>

      </div>

    </div>

  </div>

</div>

<!-- MODAL ERROR -->

<div class="modal fade"
     id="modalError"
     tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content bg-dark text-white text-center">

      <div class="modal-header border-0">

        <h5>⚠ Error</h5>

      </div>

      <div class="modal-body"
           id="textoError">

        Complete los campos obligatorios

      </div>

      <div class="modal-footer border-0">

        <button type="button"
                class="btn btn-danger w-100"
                data-bs-dismiss="modal">

          OK

        </button>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔎 BUSCADOR -->
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<script>

/* ================= URLS ================= */

const URL = "https://script.google.com/macros/s/AKfycbyhKwpJnlXsivZ4pZ0FQa3-tKdkYJyKK4s2aGnreM9Uq6OAWaNdUpa6nD7eNLlnHGgdpQ/exec";

const API_CAMINANTES =
"https://script.google.com/macros/s/AKfycby6OwTzLN8f4H-GraDredyHS-4RcLKc48mZyIqvQ3ef7hFfE6GgNK8zUD5PzhVMInew6Q/exec";

const JSON_PSR = "psragencia.json";

/* ================= SUPERVISOR ================= */

const params =
new URLSearchParams(window.location.search);

const supervisor =
params.get("supervisor") || "";

document.getElementById("supervisorInput")
.value = supervisor;

document.getElementById("titulo")
.textContent =
"Clausurados - " + supervisor;

/* ================= LOADER ================= */

function mostrarLoader() {

  document.getElementById("loader")
  .style.display = "flex";

}

function ocultarLoader() {

  document.getElementById("loader")
  .style.display = "none";

}

/* ================= VISUAL ================= */

function actualizarVisual(id) {

  const el = document.getElementById(id);

  if (el.value)
    el.classList.add("has-value");

  else
    el.classList.remove("has-value");

}

/* ================= MODAL ACCESSIBILITY ================= */

document.addEventListener("hidden.bs.modal", () => {

  if (document.activeElement) {
    document.activeElement.blur();
  }

});

const caminanteSelect = document.getElementById("caminanteSelect");
const zonaSelect = document.getElementById("zonaSelect");
const psrSelect = document.getElementById("psrSelect");
let tomPSR = null;
let datosPSR = [];
let psrDelCaminante = [];
const estadoPSR = document.getElementById("estadoPSR");

function pintarSelect(s){
  s.classList.toggle("has-value", s.value!=="");
}

document.querySelectorAll("select").forEach(s=>{
  s.addEventListener("change", ()=>pintarSelect(s));
});

function normalizarNombre(valor){
  return String(valor || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
}

function textoPSR(psr){
  return `${psr["Codigo PSR"]} - ${psr["Nombre PSR"]}`;
}

function actualizarZona(){
  const seleccionado = psrDelCaminante.find(p => String(p["Codigo PSR"]).trim() === psrSelect.value);
  if(seleccionado) zonaSelect.value = seleccionado.Zona || "";
  pintarSelect(zonaSelect);

}

psrSelect.onchange = actualizarZona;

function cargarOpcionesPSR(zona = ""){
  tomPSR.clear();
  tomPSR.clearOptions();
  tomPSR.setTextboxValue("");
  const disponibles = psrDelCaminante.filter(p => !zona || p.Zona === zona);
  tomPSR.addOptions(disponibles.map(p => ({value: String(p["Codigo PSR"]).trim(), text: textoPSR(p)})));
  if(disponibles.length){
    tomPSR.enable();
    estadoPSR.textContent = `${disponibles.length} PSR disponibles. Busque por código o nombre, o filtre por zona.`;
  } else {
    tomPSR.disable();
    estadoPSR.textContent = caminanteSelect.value
      ? "No hay PSR registrados para este caminante."
      : "Seleccione un caminante para buscar PSR.";
  }
  actualizarZona();
  pintarSelect(psrSelect);
}

caminanteSelect.onchange = function(){
  psrDelCaminante = this.value
    ? datosPSR.filter(p => normalizarNombre(p.Caminante) === normalizarNombre(this.value))
    : [];
  zonaSelect.replaceChildren(new Option("Todas las zonas", ""));
  [...new Set(psrDelCaminante.map(p => p.Zona).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"))
    .forEach(zona => zonaSelect.add(new Option(zona, zona)));
  zonaSelect.disabled = psrDelCaminante.length === 0;
  cargarOpcionesPSR();
};

zonaSelect.onchange = function(){
  cargarOpcionesPSR(this.value);
};

async function cargarDatosClausurados(){
  mostrarLoader();
  try {
    tomPSR = new TomSelect("#psrSelect", {
      create: false,
      sortField: {field: "text", direction: "asc"},
      placeholder: "Buscar por código o nombre de PSR...",
      maxOptions: 500
    });
    const [caminantes, psr] = await Promise.all([API_CAMINANTES, JSON_PSR].map(async url => {
      const respuesta = await fetch(url);
      if(!respuesta.ok) throw new Error(`No se pudo cargar ${url}`);
      return respuesta.json();
    }));
    if(!Array.isArray(psr)) throw new Error("El listado de PSR no es válido");
    datosPSR = psr;
    const lista = caminantes[supervisor] || [];
    lista.forEach(c => caminanteSelect.add(new Option(c, c)));
    caminanteSelect.disabled = lista.length === 0;
    estadoPSR.textContent = lista.length
      ? "Seleccione un caminante para buscar PSR."
      : "No hay caminantes registrados para este supervisor.";
  } catch(err) {
    console.error("Error cargando datos de auditoría:", err);
    estadoPSR.textContent = "No se pudieron cargar los caminantes o PSR. Recargue la página para reintentar.";
  } finally {
    ocultarLoader();
  }
}

cargarDatosClausurados();

/* ================= ERROR ================= */

function mostrarError(texto) {

  document.getElementById("textoError")
  .textContent = texto;

  new bootstrap.Modal(
    document.getElementById("modalError")
  ).show();

}

/* ================= ENVIAR ================= */

async function enviarAuditoria() {

  const caminante =
  document.getElementById("caminanteSelect").value;

  const zona =
  document.getElementById("zonaSelect").value;

  const psrSelect =
  document.getElementById("psrSelect");

  console.log({
    caminante,
    zona,
    psr: psrSelect.value
  });

  if (!caminante) {
    mostrarError("Seleccione caminante");
    return;
  }

  if (!zona) {
    mostrarError("Seleccione zona");
    return;
  }

  if (!psrSelect.value) {
    mostrarError("Seleccione PSR");
    return;
  }

  mostrarLoader();

  try {

    let fotos = [];

    const files =
    document.getElementById("fotos").files;

    for (let f of files) {

      const base64 =
      await new Promise(resolve => {

        const reader = new FileReader();

        reader.onload = () =>
        resolve(reader.result);

        reader.readAsDataURL(f);

      });

      fotos.push(base64);

    }

    const payload = {

      Supervisor: supervisor,

      Categoria: "Clausurados",

      Caminante: caminante,

      Zona: zona,

      PSR:
      psrSelect.options[
        psrSelect.selectedIndex
      ].text,

      Observaciones:
      document.getElementById("observaciones").value,

      Fotos: fotos.join("|||")

    };

    const res = await fetch(URL, {

      method: "POST",

      body: JSON.stringify(payload)

    });

    const text = await res.text();

    ocultarLoader();

    console.log(text);

    if (text.includes("OK")) {

      const modal =
      new bootstrap.Modal(
        document.getElementById("modalOk")
      );

      document.getElementById("modalOk")
      .addEventListener(
        "hidden.bs.modal",
        () => {
          window.location.href = "index.html";
        },
        { once: true }
      );

      modal.show();

    } else {

      mostrarError(text);

    }

  } catch (e) {

    ocultarLoader();

    console.error(e);

    mostrarError("Error enviando auditoría");

  }

}

/* ================= LIMPIAR ================= */

function limpiarFormulario() {
  caminanteSelect.value = "";
  pintarSelect(caminanteSelect);
  caminanteSelect.onchange();
  document.getElementById("observaciones").value = "";
  document.getElementById("fotos").value = "";
}
/* ================= MENU ================= */

function volverMenu() {

  window.location.href = "index.html";

}

</script>

</body>
</html>
